name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep jq
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Install exact contract projection checker
        run: >-
          cargo install --locked
          --git https://github.com/LioRael/lenso-protocols
          --rev 9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4
          lenso-contract-codegen
      - run: lenso-contract-codegen workspace check --manifest-path Cargo.toml
      - run: ./scripts/check-public-packages.sh
      - run: ./scripts/check-repository-boundary.sh
      - name: PostgreSQL restart, uniqueness, CAS, and receipt acceptance
        env:
          LENSO_SCIM_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: >-
          cargo test --locked -p lenso-scim-provisioning-postgres-plugin
          --features postgres-acceptance
          postgres_restart_uniqueness_cas_and_receipt_acceptance -- --nocapture
