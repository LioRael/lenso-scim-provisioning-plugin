[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-scim-directory",
    "crates/lenso-scim-provisioning-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-scim-provisioning-plugin"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
lenso = { version = "0.5.0" }
lenso-auth-sdk = { version = "0.2.1" }
lenso-capability-access-control-admin = { version = "0.1.0" }
lenso-capability-access-control-directory = { version = "0.1.0" }
lenso-capability-auth = { version = "0.1.2" }
lenso-capability-http-endpoint = { version = "0.2.7" }
lenso-capability-identity-directory = { version = "0.2.0" }
lenso-capability-organization-membership-admin = { version = "0.1.0" }
lenso-capability-secrets = { version = "0.1.1" }
lenso-contract-runtime = { version = "0.1.3" }
lenso-kernel = { version = "0.2.0" }
lenso-plugin-authoring = { version = "0.1.1" }
lenso-postgres-kit = { version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time", "uuid"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.52", features = ["macros", "rt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
url = "2.5"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
